;═══════════════════════════════════════════════════════════════
; Madrigal Ascension - Server Configuration
; The Next Generation MMORPG Server Settings  
; Version: 1.0.0
;═══════════════════════════════════════════════════════════════

[ServerInfo]
; Server identification
ServerName=Madrigal Ascension Server
ServerDescription=The Next Generation MMORPG Server  
Version=1.0.0
Build=1000
CompanyName=Madrigal Ascension Studio

[Network]
; Network configuration
LoginServerPort=15400
WorldServerPort=15500
DatabaseServerPort=15300
MaxConnections=1000
ConnectionTimeout=30000

; Modern networking features (Flyff 2.0)
EnableCompression=1
EnableEncryption=1
UseHybridProtocol=1
EnableLagCompensation=1

[Performance]
; Performance optimization (Phase 2)
EnableMultiThreading=1
MaxWorkerThreads=8
EnableMemoryPooling=1
EnableAntiLag=1
TargetFPS=90
MaxFPS=120

; Loading optimization
EnableAssetStreaming=1
EnablePreloading=1
EnableProgressiveLoading=1

[Security]  
; Enterprise security (Phase 5)
EnableAntiCheat=1
SecurityLevel=2
EnableBehavioralAnalysis=1
EnableMemoryProtection=1
EnablePacketValidation=1

; Anti-cheat settings
MaxMovementSpeed=200.0
TeleportThreshold=500.0
SuspicionThreshold=0.85

[Features]
; Quality of life features (Phase 4)
EnableModernUI=1
EnableAutoPickup=1
EnableSmartInventory=1
EnableAdvancedGuildTools=1
EnablePartyFinder=1

; Theme system
EnableThemes=1
DefaultTheme=Dark
EnableCustomThemes=1

; Accessibility
EnableColorblindSupport=1
EnableHighContrastMode=0

[World]
; Game world settings
WorldName=Madrigal
MaxPlayers=1000
MaxLevel=120
BaseExpRate=1.0
BaseDropRate=1.0

; Guild settings
MaxGuilds=100
MaxGuildMembers=50

[Database]
; Database configuration
DatabaseType=MySQL
DatabaseName=madrigal_ascension
DatabaseUser=madrigal
DatabasePort=3306
ConnectionPoolSize=50

[AI]
; AI Assistant (Phase 6) - Requires OpenAI API key
EnableAIAssistant=0
AIModel=gpt-4o
AITimeout=5000
AICacheSize=100

; AI features
AIQuestHelp=1
AIBuildAdvisor=1
AINavigation=1
AISocialHelp=1

[Logging]
; Logging configuration
LogLevel=2
LogToFile=1
LogDirectory=logs
MaxLogSize=10485760
MaxLogFiles=10

[Backup]
; Backup settings
EnableAutoBackup=1
BackupInterval=3600
BackupDirectory=backups
MaxBackupFiles=24

[Legacy]
; Legacy Flyff compatibility (temporary)
EnableLegacyMode=1
FlyffCompatibility=1
BackwardCompatible=1