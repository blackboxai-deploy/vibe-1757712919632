;==============================================================================
; Madrigal Ascension - Server Configuration
; Modernized server configuration replacing legacy settings
; 
; Version: 1.0.0
;==============================================================================

[ServerInfo]
; Server identification
ServerName=Madrigal Ascension Server
ServerDescription=The Next Generation MMORPG Server
Version=1.0.0
Build=1000

; Legacy compatibility
; These will be removed in v2.0
LegacyMode=1
FlyffCompatibility=1

[Network]
; Network configuration
WorldServerPort=15500
LoginServerPort=15400
DatabaseServerPort=15300
CoreServerPort=15200

; Connection settings
MaxConnections=1000
ConnectionTimeout=30000
HeartbeatInterval=30000

; Modern networking features
EnableCompression=1
EnableEncryption=1
UseHybridProtocol=1
PacketBatchSize=10

; Legacy ports for compatibility
DefaultPort=23000
LegacyWorldPort=15500

[Performance]
; Performance optimization settings
EnableMultiThreading=1
MaxWorkerThreads=8
NetworkThreads=2
DatabaseThreads=4

; Memory management
EnableMemoryPooling=1
MaxMemoryPoolSize=536870912  ; 512MB
PreloadAssets=1
AssetCacheSize=268435456     ; 256MB

; Frame rate optimization
TargetFPS=60
MaxUpdateRate=120
EnableVSync=0

[Database]
; Database configuration
DatabaseType=MSSQL
DatabaseServer=localhost
DatabaseName=MadrigalAscension
DatabaseUser=madrigal_user
DatabasePassword=madrigal_pass
DatabasePort=1433

; Connection pooling
MinConnections=5
MaxConnections=50
ConnectionPoolTimeout=30000

; Legacy database settings
LegacyTablePrefix=flyff_
UseCompatibilityMode=1

[Security]
; Security settings
EnableAntiCheat=1
EnableMemoryProtection=1
EnableBehavioralAnalysis=1
SecurityLevel=2  ; 0=Low, 1=Medium, 2=High, 3=Maximum

; Encryption
EncryptionType=AES256
EncryptionKeySize=256
UseModernSecurity=1

; Anti-cheat configuration
MaxMovementSpeed=200.0
PositionValidationInterval=100
ActionValidationEnabled=1

; Legacy security (deprecated)
OldSecurityMode=0

[World]
; World and gameplay settings
WorldName=Madrigal
MaxPlayers=1000
MaxLevel=120
BaseExpRate=1.0
BaseDropRate=1.0

; Guild settings
MaxGuilds=100
MaxGuildMembers=50
GuildExpRate=1.0

; PvP settings
EnablePvP=1
PvPLevel=60
SafeZones=1

; Legacy world settings
FlyffWorld=1
NeuzCompatible=1

[Features]
; Modern feature flags
EnableAIAssistant=0        ; Phase 6
EnableModernUI=1
EnableAutoPickup=1
EnableSmartInventory=1
EnableAdvancedGuildTools=1
EnablePerformanceMode=1

; Quality of life improvements
EnableQuickSkills=1
EnableSmartCamera=1
EnableEnhancedMiniMap=1
EnablePartyFinder=1

; Accessibility features
EnableColorblindSupport=1
EnableHighContrastMode=0
EnableScreenReaderSupport=0

[Logging]
; Logging configuration
LogLevel=2  ; 0=None, 1=Error, 2=Warning, 3=Info, 4=Debug
LogToFile=1
LogToConsole=1
LogDirectory=logs
MaxLogSize=10485760  ; 10MB
MaxLogFiles=10

; Log categories
LogNetwork=1
LogDatabase=1
LogSecurity=1
LogPerformance=1
LogAI=0  ; Phase 6

[Debug]
; Debug and development settings
DebugMode=0
EnableConsole=0
EnableProfiling=0
EnableMetrics=1
EnableCrashReporting=1

; Development features
DevToolsEnabled=0
AdminCommandsEnabled=1
TestModeEnabled=0

[AI]
; AI Assistant configuration (Phase 6 - Currently disabled)
EnableAI=0
AIServiceURL=http://localhost:8080/ai
AITimeout=5000
AICacheSize=100
AIMaxHistory=50

; AI features
AIQuestHelp=0
AIBuildAdvisor=0
AIChatAssistant=0
AINavigationHelp=0

[Legacy]
; Legacy compatibility settings
; These will be removed in Madrigal Ascension v2.0
EnableLegacyMode=1
FlyffCompatibilityMode=1
NeuzProtocolSupport=1
OldClientSupport=1

; Legacy defines
LegacyDefines=1
OldResourceFormat=1
BackwardCompatibility=1

; Migration settings
AutoMigrateLegacyData=1
PreserveLegacySettings=1
WarnLegacyFeatures=1

[UI]
; User interface configuration
EnableModernThemes=1
DefaultTheme=Dark
EnableCustomThemes=1
ScalableUI=1

; Theme options
DarkMode=1
LightMode=1
ClassicMode=1
CustomColors=1

; UI performance
EnableHardwareAcceleration=1
UIFrameRate=60
EnableSmoothAnimations=1

[Audio]
; Audio system configuration
EnableAudio=1
MasterVolume=100
BackgroundMusic=80
SoundEffects=90
VoiceChat=70

; Audio quality
AudioQuality=High  ; Low, Medium, High, Ultra
EnableSpatialAudio=1
Enable3DAudio=1

[Graphics]
; Graphics configuration
EnableModernRenderer=1
GraphicsAPI=DirectX11  ; DirectX11, DirectX12, OpenGL, Vulkan
DefaultResolution=1920x1080
DefaultFullscreen=0

; Graphics quality
TextureQuality=High
ModelQuality=High
EffectsQuality=High
ShadowQuality=Medium

; Performance settings
EnableLODSystem=1
MaxDrawDistance=1000.0
EnableOcclusion=1
EnableMultiSampling=1

[Backup]
; Backup and recovery settings
EnableAutoBackup=1
BackupInterval=3600000  ; 1 hour in milliseconds
BackupDirectory=backups
MaxBackupFiles=24       ; Keep 24 hours of backups

; What to backup
BackupPlayerData=1
BackupGuildData=1
BackupWorldState=1
BackupConfiguration=1

[Maintenance]
; Maintenance and monitoring
EnableMaintenanceMode=0
MaintenanceMessage=Server is under maintenance
MaintenanceStartTime=02:00
MaintenanceEndTime=04:00

; Monitoring
EnablePerformanceMonitoring=1
MonitoringInterval=60000    ; 1 minute
AlertThresholds=1
EnableHealthCheck=1

[Updates]
; Update system configuration
EnableAutoUpdates=0
UpdateServerURL=https://updates.madrigalascension.com
CheckUpdateInterval=86400000  ; 24 hours
DownloadUpdatesBackground=1

; Update channels
UpdateChannel=stable  ; stable, beta, dev
AllowDowngrade=0
BackupBeforeUpdate=1